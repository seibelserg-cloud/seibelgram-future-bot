name: SEIBELGRAM — safe generator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: 'Offline test (no API requests, no publication)'
        type: boolean
        required: true
        default: true
      photos:
        description: 'Generate two photo previews for review, without social publishing'
        type: boolean
        required: true
        default: false
      check_buffer:
        description: 'Verify Buffer token and @seibelgram connection; no publishing'
        type: boolean
        required: true
        default: false
      check_cloudflare:
        description: 'Check Cloudflare token and generate one test image; never publishes'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '7 11 * * *'
    - cron: '7 18 * * *'

permissions:
  contents: read

concurrency:
  group: seibelgram-generator
  cancel-in-progress: false

jobs:
  preview:
    # Scheduled execution is OFF until explicitly enabled in repository Variables.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.ENABLE_AI_GENERATION == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Run safety tests
        run: python -m unittest -v test_bot test_photos test_quality_gate test_image_models
      - name: Generate vertical MP4 preview
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MANUAL_DEMO: ${{ github.event_name == 'push' && 'true' || inputs.demo }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -eu
          SLOT=1
          if [ "$CRON_EXPRESSION" = '7 18 * * *' ]; then SLOT=2; fi
          if [ "$MANUAL_DEMO" = "true" ]; then
            python bot.py --demo --slot "$SLOT"
          else
            python bot.py --slot "$SLOT"
          fi
      - name: Save MP4 and caption for review
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-preview
          path: site/
          retention-days: 7

# No workflow step publishes to TikTok or Instagram.
# Automatic publication will be added only after a real API and content test.

  cloudflare_connectivity:
    # One-time explicit verification only; no publishing or ongoing spending.
    if: (github.event_name == 'push' && github.event.head_commit.message == 'Verify Cloudflare secrets and connection') || (github.event_name == 'workflow_dispatch' && inputs.check_cloudflare == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify Cloudflare account and generate one test image
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python verify_cloudflare.py
      - name: Save test image without exposing API token
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-smoke-image
          path: cloudflare-test-image.jpg
          retention-days: 7

  real_preview_once:
    # One explicit first AI video preview. Does not publish and has no daily trigger.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Generate first real SEIBELGRAM preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Run safety tests
        run: python -m unittest -v test_bot
      - name: Create real AI concept video without posting
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python bot.py --slot 1
      - name: Store first real video and captions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-real-ai-preview
          path: site/
          retention-days: 7

  buffer_connectivity:
    # Read-only check. No post creation; can be requested manually at any time.
    if: (github.event_name == 'workflow_dispatch' && inputs.check_buffer == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Verify Buffer connection')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Confirm Buffer API and correct TikTok (read only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publish.py --verify

  photo_preview:
    # Generates still images only; no TikTok or Buffer API request is made.
    if: (github.event_name == 'workflow_dispatch' && inputs.photos == true) || (github.event_name == 'push' && (github.event.head_commit.message == 'Generate SEIBELGRAM photo preview' || github.event.head_commit.message == 'Generate SEIBELGRAM impossible showcase' || github.event.head_commit.message == 'Generate SEIBELGRAM FLUX2 photo pair'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run photo and safety tests
        run: |
          python -m unittest -v test_bot
          python -m unittest -v test_photos
          python -m unittest -v test_quality_gate
          python -m unittest -v test_image_models
      - name: Generate original AI photos with no collages or text
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SHOWCASE: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Generate SEIBELGRAM impossible showcase' }}
        run: |
          if [ "$SHOWCASE" = "true" ]; then
            python photo_bot.py --showcase
          else
            python photo_bot.py
          fi
      - name: Run free AI vision quality gate on new photos (NO publication)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python quality_gate.py photo_output/car-*.jpg --online --output photo_output/qa-report.json
      - name: Archive successful photos and failure report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-photo-preview
          path: photo_output/
          if-no-files-found: ignore
          retention-days: 7

  stage_photo_draft_once:
    # Technical dry run: public GitHub image hosting + unscheduled Buffer DRAFT.
    # No TikTok publishing, no scheduled queue entries.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Stage first Buffer photo draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Download approved-for-technical-test photos from previous preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 42481165992 --name seibelgram-photo-preview --dir .photo-staging
          test -s .photo-staging/car-1.jpg
          test -s .photo-staging/car-2.jpg
      - name: Host technical preview photos in dedicated public folder
        run: |
          set -eu
          if test -e content/test-2026-11-08/car-1.jpg; then
            echo "Photos were staged in an earlier run. Refusing to duplicate the draft."
            exit 1
          fi
          mkdir -p content/test-2026-11-08
          cp .photo-staging/car-1.jpg content/test-2026-11-08/car-1.jpg
          cp .photo-staging/car-2.jpg content/test-2026-11-08/car-2.jpg
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/test-2026-11-08/*.jpg
          git commit -m "Host technical photo previews, not social posts"
          git push
      - name: Save unscheduled Buffer draft only (NO PUBLISHING)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SEIBELGRAM_ALLOW_DRAFT_ONLY: "yes"
        run: |
          python photo_draft.py --urls             "https://raw.githubusercontent.com/seibelserg-cloud/seibelgram-future-bot/main/content/test-2026-11-08/car-1.jpg"             "https://raw.githubusercontent.com/seibelserg-cloud/seibelgram-future-bot/main/content/test-2026-11-08/car-2.jpg"
      - name: Save draft result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-buffer-photo-draft
          path: photo-draft-result.json
          retention-days: 7

  first_live_photo_test:
    # Explicit, single public test: never scheduled or repeated; no bulk posting.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publish one SEIBELGRAM photo test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare portrait with same silver car and create one-shot lock
        run: python one_shot_photo.py prepare
      - name: Persist published media and attempt lock BEFORE posting
        run: |
          set -eu
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/first-live-test-2026-11-08
          git commit -m "Reserve first live photo test; never retry"
          git push
      - name: Publish exactly one photo to @seibelgram through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SEIBELGRAM_ONE_SHOT_LIVE_TEST: "yes"
        run: python one_shot_photo.py publish
      - name: Store result for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-first-live-photo-test-result
          path: |
            seibelgram-first-test-result.json
            content/first-live-test-2026-11-08/photo.jpg
          retention-days: 7

  daily_healthcheck:
    # Server-side maintenance only. The real posting workflow is still locked.
    if: github.event_name == 'schedule' && github.event.schedule == '7 11 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all local safety checks
        run: |
          python -m unittest -v test_bot
          python -m unittest -v test_photos
          python -m unittest -v test_quality_gate
      - name: Verify Buffer still connected to @seibelgram (read only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publish.py --verify
      - name: Explain safety state
        run: |
          echo "SEIBELGRAM healthcheck completed. NO post created."
          echo "Unattended publishing remains disabled pending Buffer incident closure, deduplication and visual QA."

  qa_smoke_once:
    # Explicit check against two known generated photos; never writes to Buffer.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run SEIBELGRAM AI visual QA smoke test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: All fail-closed tests
        run: |
          python -m unittest -v test_quality_gate
          python -m unittest -v test_photos
          python -m unittest -v test_bot
      - name: Assess two known images with AI vision without posting
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python quality_gate.py             content/test-2026-11-08/car-1.jpg             content/test-2026-11-08/car-2.jpg             --archive content/first-live-test-2026-11-08             --online --output qa-smoke-report.json
      - name: Store QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-qa-smoke
          path: qa-smoke-report.json
          retention-days: 7

  daily_candidate_qa:
    # Two daily photo batches, guarded by strict QA. This NEVER publishes anything.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run quality safety tests
        run: python -m unittest -v test_quality_gate test_photos test_image_models
      - name: Generate separate image candidates
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -eu
          SLOT=1
          if [ "$CRON_EXPRESSION" = '7 18 * * *' ]; then SLOT=2; fi
          python photo_bot.py --slot "$SLOT"
      - name: Run real visual QA, check branding, originality and duplicate images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python quality_gate.py photo_output/car-1.jpg photo_output/car-2.jpg --online --output photo_output/qa-report.json
      - name: Archive candidate images and QA report; NOT published
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-daily-qa-candidates
          path: photo_output/
          if-no-files-found: ignore
          retention-days: 7

  flux2_free_smoke:
    # One Free-quota quality experiment; NEVER uploads to social media.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Test free FLUX2 Klein image'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify creative prompt and safe tests
        run: python -m unittest -v test_bot test_photos test_quality_gate
      - name: Request ONE free-quota FLUX.2 Klein 9B image; NO posting
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python verify_flux2_klein.py
      - name: Keep a reviewable test result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-flux2-klein-test
          path: flux2-klein-smoke.jpg
          retention-days: 7

  nov9_one_photo_candidate:
    # Emergency one-shot review only: real free Flux 2 image and QA report, no social posting.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Generate Nov 9 SEIBELGRAM candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Generate one new car portrait and caption
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python today_candidate.py
      - name: Real AI vision review
        if: success()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python quality_gate.py today_candidate/source.jpg --online --output today_candidate/qa-report.json
      - name: Preserve images even if QA service fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-nov9-single-candidate
          path: today_candidate/
          retention-days: 7

  nov9_runway_stage_only:
    if: github.event_name == 'push' && (github.event.head_commit.message == 'Stage Nov9 Runway photo for review' || github.event.head_commit.message == 'Stage Nov9 magenta image for review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install -r requirements.txt
      - name: Download one Runway-generated car image
        env:
          IMAGE_URL: https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/50a2d32c-fbc0-4618-8265-63bea9748c6e/0ff71c6c-2cd8-4c16-80d8-03ae358279e7/One_standalone_hyperreal_future_car_photograph__vertical_9_1.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzM1NjJjZWMwM2ZmOWRkMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQwNzkxNn0.S7WnWAW9ohYGkEobtWimrc40UPeiIoNJ_pRJTpn2MVU
        run: |
          mkdir -p today_review
          curl -fsSL --retry 1 --max-time 70 "$IMAGE_URL" -o today_review/original-image
          python - <<'PY'
          from PIL import Image
          p="today_review/original-image"
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              print("Verified source image", im.size, im.format)
              assert im.width >= 480 and im.height >= 800
              assert im.height > im.width
              im.convert("RGB").save("today_review/car.jpg", quality=94, optimize=True)
          PY
      - name: Review artifact ONLY - do not publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-nov9-runway-editorial-review
          path: today_review/
          if-no-files-found: ignore
          retention-days: 7

  nov9_publish_magenta_once:
    # Human-reviewed one-shot only, no scheduled / recurring TikTok publishing.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publish Nov9 magenta SEIBELGRAM photo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Download the editorially reviewed fresh image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .review
          gh run download 42636823339 --name seibelgram-nov9-runway-editorial-review --dir .review
          test -s .review/car.jpg
      - name: Stage photo and irrevocable one-shot reservation
        run: python nov9_publish.py stage
      - name: Commit photo and duplicate lock BEFORE social API call
        run: |
          set -eu
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/2026-11-09-magenta/
          git commit -m "Reserve one Nov 9 TikTok photo; never submit again"
          git push
      - name: Submit one photo to Buffer @seibelgram
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SEIBELGRAM_NOV9_LIVE_ONE_SHOT: "yes"
        run: python nov9_publish.py publish
      - name: Preserve receipt and photo irrespective of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-nov9-published-check
          path: |
            nov9-publication-result.json
            content/2026-11-09-magenta/photo.jpg
          if-no-files-found: ignore
          retention-days: 7

  nov9_buffer_status:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Verify Nov9 TikTok publication'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Read ONLY posted status and external TikTok link
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python verify_nov9_post.py
      - name: Archive confirmation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-nov9-buffer-status
          path: nov9-publish-status.json
          if-no-files-found: ignore
          retention-days: 7

  original_soundtrack_demo_once:
    # Local synthesized audio; no TikTok/Buffer publishing.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Test SEIBELGRAM music reel'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: |
          python -m pip install -r requirements.txt
          ffmpeg -version | head -1
      - name: Test original 3-style soundtrack and encoded 9-second AAC video
        run: python -m unittest -v test_reel_from_photo
      - name: Create original sound video from previous approved magenta car
        run: |
          test -s content/2026-11-09-magenta/photo.jpg
          python reel_from_photo.py \
            --image content/2026-11-09-magenta/photo.jpg \
            --output music_preview/SEIBELGRAM-magenta-original-electronic.mp4 \
            --style neon-pulse
          ffprobe -v error -show_entries stream=codec_name,codec_type -of json music_preview/*.mp4
      - name: Keep reviewable video (NO social posting)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-original-sound-review
          path: music_preview/
          retention-days: 7
