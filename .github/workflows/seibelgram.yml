name: SEIBELGRAM — safe generator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: 'Offline test (no API requests, no publication)'
        type: boolean
        required: true
        default: true
      photos:
        description: 'Generate two photo previews for review, without social publishing'
        type: boolean
        required: true
        default: false
      check_buffer:
        description: 'Verify Buffer token and @seibelgram connection; no publishing'
        type: boolean
        required: true
        default: false
      check_cloudflare:
        description: 'Check Cloudflare token and generate one test image; never publishes'
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '7 11 * * *'
    - cron: '7 18 * * *'

permissions:
  contents: read

concurrency:
  group: seibelgram-generator
  cancel-in-progress: false

jobs:
  preview:
    # Scheduled execution is OFF until explicitly enabled in repository Variables.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.ENABLE_AI_GENERATION == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Run safety tests
        run: python -m unittest -v test_bot
      - name: Generate vertical MP4 preview
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MANUAL_DEMO: ${{ github.event_name == 'push' && 'true' || inputs.demo }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -eu
          SLOT=1
          if [ "$CRON_EXPRESSION" = '7 18 * * *' ]; then SLOT=2; fi
          if [ "$MANUAL_DEMO" = "true" ]; then
            python bot.py --demo --slot "$SLOT"
          else
            python bot.py --slot "$SLOT"
          fi
      - name: Save MP4 and caption for review
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-preview
          path: site/
          retention-days: 7

# No workflow step publishes to TikTok or Instagram.
# Automatic publication will be added only after a real API and content test.

  cloudflare_connectivity:
    # One-time explicit verification only; no publishing or ongoing spending.
    if: (github.event_name == 'push' && github.event.head_commit.message == 'Verify Cloudflare secrets and connection') || (github.event_name == 'workflow_dispatch' && inputs.check_cloudflare == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify Cloudflare account and generate one test image
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python verify_cloudflare.py
      - name: Save test image without exposing API token
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-smoke-image
          path: cloudflare-test-image.jpg
          retention-days: 7

  real_preview_once:
    # One explicit first AI video preview. Does not publish and has no daily trigger.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Generate first real SEIBELGRAM preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Run safety tests
        run: python -m unittest -v test_bot
      - name: Create real AI concept video without posting
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python bot.py --slot 1
      - name: Store first real video and captions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-real-ai-preview
          path: site/
          retention-days: 7

  buffer_connectivity:
    # Read-only check. No post creation; can be requested manually at any time.
    if: (github.event_name == 'workflow_dispatch' && inputs.check_buffer == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Verify Buffer connection')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Confirm Buffer API and correct TikTok (read only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publish.py --verify

  photo_preview:
    # Generates still images only; no TikTok or Buffer API request is made.
    if: (github.event_name == 'workflow_dispatch' && inputs.photos == true) || (github.event_name == 'push' && github.event.head_commit.message == 'Generate SEIBELGRAM photo preview')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run photo and safety tests
        run: |
          python -m unittest -v test_bot
          python -m unittest -v test_photos
      - name: Generate two AI photos, without any text overlays
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python photo_bot.py
      - name: Archive photos and captions for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-photo-preview
          path: photo_output/
          retention-days: 7

  stage_photo_draft_once:
    # Technical dry run: public GitHub image hosting + unscheduled Buffer DRAFT.
    # No TikTok publishing, no scheduled queue entries.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Stage first Buffer photo draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Download approved-for-technical-test photos from previous preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 42481165992 --name seibelgram-photo-preview --dir .photo-staging
          test -s .photo-staging/car-1.jpg
          test -s .photo-staging/car-2.jpg
      - name: Host technical preview photos in dedicated public folder
        run: |
          set -eu
          if test -e content/test-2026-11-08/car-1.jpg; then
            echo "Photos were staged in an earlier run. Refusing to duplicate the draft."
            exit 1
          fi
          mkdir -p content/test-2026-11-08
          cp .photo-staging/car-1.jpg content/test-2026-11-08/car-1.jpg
          cp .photo-staging/car-2.jpg content/test-2026-11-08/car-2.jpg
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/test-2026-11-08/*.jpg
          git commit -m "Host technical photo previews, not social posts"
          git push
      - name: Save unscheduled Buffer draft only (NO PUBLISHING)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SEIBELGRAM_ALLOW_DRAFT_ONLY: "yes"
        run: |
          python photo_draft.py --urls             "https://raw.githubusercontent.com/seibelserg-cloud/seibelgram-future-bot/main/content/test-2026-11-08/car-1.jpg"             "https://raw.githubusercontent.com/seibelserg-cloud/seibelgram-future-bot/main/content/test-2026-11-08/car-2.jpg"
      - name: Save draft result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-buffer-photo-draft
          path: photo-draft-result.json
          retention-days: 7

  first_live_photo_test:
    # Explicit, single public test: never scheduled or repeated; no bulk posting.
    if: github.event_name == 'push' && github.event.head_commit.message == 'Publish one SEIBELGRAM photo test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare portrait with same silver car and create one-shot lock
        run: python one_shot_photo.py prepare
      - name: Persist published media and attempt lock BEFORE posting
        run: |
          set -eu
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add content/first-live-test-2026-11-08
          git commit -m "Reserve first live photo test; never retry"
          git push
      - name: Publish exactly one photo to @seibelgram through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SEIBELGRAM_ONE_SHOT_LIVE_TEST: "yes"
        run: python one_shot_photo.py publish
      - name: Store result for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seibelgram-first-live-photo-test-result
          path: |
            seibelgram-first-test-result.json
            content/first-live-test-2026-11-08/photo.jpg
          retention-days: 7

  daily_healthcheck:
    # Server-side maintenance only. The real posting workflow is still locked.
    if: github.event_name == 'schedule' && github.event.schedule == '7 11 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all local safety checks
        run: |
          python -m unittest -v test_bot
          python -m unittest -v test_photos
      - name: Verify Buffer still connected to @seibelgram (read only)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publish.py --verify
      - name: Explain safety state
        run: |
          echo "SEIBELGRAM healthcheck completed. NO post created."
          echo "Unattended publishing remains disabled pending Buffer incident closure, deduplication and visual QA."
